<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History | Proovia Dashboard</title>
    <meta name="description" content="Browse previous Proovia business delivery orders and payment status.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://proovia.co.uk/dashboard-history.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Order History | Proovia Dashboard">
    <meta property="og:description" content="Browse previous Proovia business delivery orders and payment status.">
    <meta property="og:url" content="https://proovia.co.uk/dashboard-history.html">
    <meta property="og:image" content="https://proovia.co.uk/photo/herobg.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Order History | Proovia Dashboard">
    <meta name="twitter:description" content="Browse previous Proovia business delivery orders and payment status.">
    <meta name="twitter:image" content="https://proovia.co.uk/photo/herobg.png">
    <link rel="icon" type="image/png" sizes="32x32" href="photo/logotitle.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem("theme") || "dark";
                if (theme !== "light" && theme !== "dark") theme = "dark";
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.classList.add("theme-preload");
            } catch (error) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="stylesheet" href="style/dashboard.css">
</head>

<body data-dashboard-page="history">

    <div class="layout">
        <div id="dashboardSidebarMount"></div>

        <main class="main">
            <div id="dashboardTopbarMount"></div>

            <div class="content">
<section class="page active" id="page-history">
                    <div class="panel panel-animated">
                        <div class="panel-header">
                            <span class="panel-title">Orders History</span>
                        </div>

                        <div class="inline-search-wrap">
                            <div class="inline-search">
                                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <circle cx="11" cy="11" r="8" />
                                    <path d="m21 21-4.35-4.35" stroke-linecap="round" stroke-width="2" />
                                </svg>
                                <input placeholder="Search orders…">
                            </div>
                        </div>
                        <div id="historyOrdersContainer"></div>

                    </div>
                </section><!-- /page-history -->
            </div><!-- /content -->
        </main><!-- /main -->
    </div><!-- /layout -->

    <div class="toast" id="toast"></div>

    <script type="module" src="js/dashboard-shell.js"></script>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/theme.js"></script>

</body>

</html>
