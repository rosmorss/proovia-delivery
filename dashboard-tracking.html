<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Tracking | Proovia Dashboard</title>
    <meta name="description" content="Track Proovia business delivery orders from the dashboard.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://proovia.co.uk/dashboard-tracking.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Business Tracking | Proovia Dashboard">
    <meta property="og:description" content="Track Proovia business delivery orders from the dashboard.">
    <meta property="og:url" content="https://proovia.co.uk/dashboard-tracking.html">
    <meta property="og:image" content="https://proovia.co.uk/photo/herobg.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Business Tracking | Proovia Dashboard">
    <meta name="twitter:description" content="Track Proovia business delivery orders from the dashboard.">
    <meta name="twitter:image" content="https://proovia.co.uk/photo/herobg.png">
    <link rel="icon" type="image/png" sizes="32x32" href="photo/logotitle.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem("theme") || "dark";
                if (theme !== "light" && theme !== "dark") theme = "dark";
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.classList.add("theme-preload");
            } catch (error) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="stylesheet" href="style/dashboard.css">
</head>

<body data-dashboard-page="tracking">

    <div class="layout">
        <div id="dashboardSidebarMount"></div>

        <main class="main">
            <div id="dashboardTopbarMount"></div>

            <div class="content">
<section class="page active" id="page-tracking">
                    <div class="tracking-dashboard-grid">
                        <div class="panel panel-animated">
                            <div class="panel-header tracking-panel-header">
                                <div>
                                    <span class="panel-title">Track an Order</span>
                                    <p class="panel-sub-copy">Choose a recent order or enter a tracking number.</p>
                                </div>
                            </div>

                            <div class="tracking-search-section">
                                <div class="tracking-input-wrap">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <circle cx="11" cy="11" r="8" />
                                        <path d="m21 21-4.35-4.35" stroke-linecap="round" stroke-width="2" />
                                    </svg>
                                    <input id="dashboardTrackingInput" type="text" autocomplete="off"
                                        placeholder="Enter tracking number">
                                </div>
                                <button class="btn-submit tracking-submit" id="dashboardTrackingButton"
                                    type="button">Track</button>
                            </div>

                            <div class="tracking-recent-section">
                                <div class="tracking-section-title">Latest orders</div>
                                <div id="dashboardTrackingRecent" class="tracking-chip-list"></div>
                            </div>
                        </div>

                        <div id="dashboardTrackingResult" class="tracking-result-shell"></div>
                    </div>
                </section><!-- /page-tracking -->
            </div><!-- /content -->
        </main><!-- /main -->
    </div><!-- /layout -->

    <div class="toast" id="toast"></div>

    <script type="module" src="js/dashboard-shell.js"></script>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/theme.js"></script>

</body>

</html>
