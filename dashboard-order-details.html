<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details | Proovia Dashboard</title>
    <meta name="description" content="View route, items, status and payment details for a Proovia business delivery order.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://proovia.co.uk/dashboard-order-details.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Order Details | Proovia Dashboard">
    <meta property="og:description" content="View route, items, status and payment details for a Proovia business delivery order.">
    <meta property="og:url" content="https://proovia.co.uk/dashboard-order-details.html">
    <meta property="og:image" content="https://proovia.co.uk/photo/herobg.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Order Details | Proovia Dashboard">
    <meta name="twitter:description" content="View route, items, status and payment details for a Proovia business delivery order.">
    <meta name="twitter:image" content="https://proovia.co.uk/photo/herobg.png">
    <link rel="icon" type="image/png" sizes="32x32" href="photo/logotitle.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem("theme") || "dark";
                if (theme !== "light" && theme !== "dark") theme = "dark";
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.classList.add("theme-preload");
            } catch (error) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="stylesheet" href="style/dashboard.css">
</head>

<body data-dashboard-page="order-details">

    <div class="layout">
        <div id="dashboardSidebarMount"></div>

        <main class="main">
            <div id="dashboardTopbarMount"></div>

            <div class="content">
<section class="page active" id="page-order-details">
                    <div id="orderDetailsContainer"></div>
                </section><!-- /page-order-details -->
            </div><!-- /content -->
        </main><!-- /main -->
    </div><!-- /layout -->

    <div class="toast" id="toast"></div>

    <script type="module" src="js/dashboard-shell.js"></script>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/theme.js"></script>

</body>

</html>
