<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Claim | Proovia Dashboard</title>
    <meta name="description" content="Report an issue or claim for a Proovia business delivery order.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://proovia.co.uk/dashboard-claim.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Report a Claim | Proovia Dashboard">
    <meta property="og:description" content="Report an issue or claim for a Proovia business delivery order.">
    <meta property="og:url" content="https://proovia.co.uk/dashboard-claim.html">
    <meta property="og:image" content="https://proovia.co.uk/photo/herobg.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Report a Claim | Proovia Dashboard">
    <meta name="twitter:description" content="Report an issue or claim for a Proovia business delivery order.">
    <meta name="twitter:image" content="https://proovia.co.uk/photo/herobg.png">
    <link rel="icon" type="image/png" sizes="32x32" href="photo/logotitle.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem("theme") || "dark";
                if (theme !== "light" && theme !== "dark") theme = "dark";
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.classList.add("theme-preload");
            } catch (error) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="stylesheet" href="style/dashboard.css">
</head>

<body data-dashboard-page="claim">

    <div class="layout">
        <div id="dashboardSidebarMount"></div>

        <main class="main">
            <div id="dashboardTopbarMount"></div>

            <div class="content">
<section class="page active" id="page-claim">
                    <div class="panel panel-md panel-animated">
                        <div class="panel-header">
                            <span class="panel-title">Report a Claim</span>
                        </div>
                        <div class="form-section">
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Order Number *</label>
                                    <input class="form-input" placeholder="Search an order…">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Issue Type *</label>
                                    <select class="form-input">
                                        <option value="">Select a type</option>
                                        <option>Damaged item</option>
                                        <option>Missing item</option>
                                        <option>Late delivery</option>
                                        <option>Wrong address</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group form-group-mb">
                                <label class="form-label">Description *</label>
                                <textarea class="form-textarea"
                                    placeholder="Please describe the issue with as much detail as possible…"></textarea>
                            </div>

                            <div class="upload-area">
                                <div class="upload-icon">📎</div>
                                <div class="upload-text">Click to upload supporting photos or documents</div>
                            </div>

                            <div class="checkbox-row">
                                <input type="checkbox" id="confirm-check">
                                <label for="confirm-check">I confirm that the information provided is accurate to the
                                    best of my knowledge.</label>
                            </div>

                            <button class="btn-submit" type="button"
                                onclick="showToast('✅ Claim submitted successfully!')">Submit Claim</button>
                        </div>
                    </div>
                </section><!-- /page-claim -->
            </div><!-- /content -->
        </main><!-- /main -->
    </div><!-- /layout -->

    <div class="toast" id="toast"></div>

    <script type="module" src="js/dashboard-shell.js"></script>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/theme.js"></script>

</body>

</html>
